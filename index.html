<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Гонка без травм</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><header class="hero"><div class="badge">🏍️ ДЕТСКОЕ ЭНДУРО</div><h1>Гонка без травм</h1><p>Сначала безопасность — потом скорость!</p><button onclick="newGame()">Новая игра</button> <button onclick="showHow()">Как играть</button> <button onclick="showSafety()">Моя безопасность</button></header><section id="setup" class="panel"><h2>Кто выходит на трассу?</h2><label>Игроков <select id="count" onchange="inputs()"><option>2</option><option>3</option><option>4</option></select></label><div id="names"></div><button class="start" onclick="start()">🏁 Начать гонку</button></section><section id="game" class="hidden"><div class="top"><div id="turn" class="panel"></div><div class="panel dice"><span id="die">⚄</span><button onclick="roll()">Бросить кубик</button></div></div><div class="legend"><b class="o">Экипировка</b><b class="b">Мотоцикл</b><b class="p">Трасса</b><b class="r">Ситуация</b><b class="y">Безопасное решение</b></div><div class="track"><div class="mount m1"></div><div class="mount m2"></div><div class="trees">🌲　　🌲　　　　　　　🌲<br>　　　🌲　　　　　🌲　　　　　　🌲</div><svg viewBox="0 0 1000 620" preserveAspectRatio="none"><path class="road0" d="M85 545 C180 490 105 405 240 370 C380 335 270 250 430 225 C590 200 510 105 680 100 C820 95 780 180 900 150"/><path class="road1" d="M85 545 C180 490 105 405 240 370 C380 335 270 250 430 225 C590 200 510 105 680 100 C820 95 780 180 900 150"/></svg><div id="cells"></div><div class="flag start">🏁<small>СТАРТ</small></div><div class="flag finish">🏁<small>ФИНИШ</small></div><div class="sign s1">⚠️<small>Внимание!</small></div><div class="sign s2">🛑<small>Стоп</small></div><div id="tokens"></div></div><div id="question" class="panel q">Брось кубик и двигайся по трассе!</div><div id="status" class="status"></div></section><div id="modal" class="modal hidden"><div class="modalbox"><button onclick="closeModal()" class="x">×</button><div id="modalText"></div></div></div></div><script src="script.js"></script></body></html>
