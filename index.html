<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Гонка без травм</title><link rel="stylesheet" href="style.css"></head><body><header><h1>🏁 Гонка без травм</h1><p>Безопасность в детском эндуро</p></header><main><section id="setup" class="card"><h2>Кто играет?</h2><select id="count"><option>2</option><option>3</option><option>4</option></select><div id="names"></div><button id="start">Начать игру</button></section><section id="game" class="hidden"><div class="top"><b>Ход: <span id="turn"></span></b><button id="restart">↻ Заново</button></div><div id="board"></div><div class="card controls"><button id="dice">🎲 Бросить кубик</button><b id="roll">—</b><span id="status">Бросай кубик!</span></div><div id="players" class="players"></div></section><div id="modal" class="modal hidden"><div class="card"><h2 id="qt"></h2><p id="qq"></p><div id="answers"></div><button id="close" class="hidden">Продолжить</button></div></div><section class="card"><h2>🛡️ Моя безопасность</h2><label><input type="checkbox"> Шлем</label><label><input type="checkbox"> Мотоботы</label><label><input type="checkbox"> Перчатки</label><label><input type="checkbox"> Защита груди и спины</label><label><input type="checkbox"> Защита коленей и локтей</label><label><input type="checkbox"> Проверка мотоцикла</label></section></main><script src="script.js"></script></body></html>
